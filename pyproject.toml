[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bochat-ai-summary"
version = "0.1.0"
description = "BoChat group summary bot plugin"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "bochat community" }]
dependencies = [
  "bochat-sdk[ws]>=0.1.1",
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0",
  "pytest>=8.0",
]

[project.scripts]
bochat-ai-summary = "bochat_ai_summary.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bochat_ai_summary"]
